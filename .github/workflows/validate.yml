name: Validate beforeword

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Resolve the commit that published the selected release checksums.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check text request and response formats
        run: python3 scripts/test_payload.py
      - name: Check release selection and exact core packaging boundaries
        run: python3 -B scripts/test_release_contract.py
      - name: Check published navigation and theme wrapper preservation
        run: python3 -B scripts/test_site_wrapper.py
      - name: Check current evaluation records and instruction hashes
        run: python3 -B scripts/test_validation.py
      - name: Check candidate sources and evaluation infrastructure without model calls
        run: |
          python3 -B evaluations/instruction-1.3.6/verify_candidate.py
          python3 -B evaluations/instruction-1.3.6/test_verify_candidate.py
          python3 -B evaluations/instruction-1.3.6/build_candidate_bundle.py --check
          python3 -B evaluations/multi-provider/run.py --self-test
          python3 -B evaluations/multi-provider/score.py --self-test
          python3 -B evaluations/multi-provider/test_runner_contract.py
          python3 -B evaluations/multi-provider/test_checkpoint.py
          python3 -B -O evaluations/multi-provider/test_runner_contract.py
          python3 -B -O evaluations/multi-provider/test_checkpoint.py
      - name: Build standalone guide from the current checkout
        run: python3 -B scripts/build_guide.py --output "$RUNNER_TEMP/current-guide"
      - name: Check guide behavior in a simulated DOM
        run: node scripts/test_guide.cjs "$RUNNER_TEMP/current-guide/beforeword_AI.html"
      - name: Check RU and EN package contents
        run: python3 scripts/test_packages.py
      - name: Check directory packages and GPT instruction drafts
        run: |
          python3 -B catalog/build.py --check
          python3 -B catalog/check.py
      - name: Rebuild and verify the published downloads from their release sources
        run: |
          version="$(python3 -B -c 'from scripts.release_contract import VERSION; print(VERSION)')"
          release_dir="$GITHUB_WORKSPACE/downloads/$version"
          release_commit="$(git log -1 --format=%H -- "downloads/$version/SHA256SUMS.txt")"
          test -n "$release_commit"
          echo "Rebuilding release $version from $release_commit"
          release_source="$RUNNER_TEMP/beforeword-release-source"
          git worktree add --detach "$release_source" "$release_commit"

          python3 -B "$release_source/scripts/build_downloads.py" --output "$release_dir" --hydrate
          python3 -B "$release_source/scripts/build_downloads.py" --output "$release_dir" --check
          python3 -B "$release_source/scripts/build_guide.py" --output build/toolkit
          cmp "$release_dir/beforeword_AI_${version}.html" build/toolkit/beforeword_AI.html
          (cd "$release_dir" && sha256sum --check SHA256SUMS.txt)

          # The current instructions and installable packages must still match the release.
          current_dir="$RUNNER_TEMP/current-downloads"
          python3 -B scripts/build_downloads.py --output "$current_dir"
          diff --brief --recursive --exclude="beforeword_toolkit_${version}.zip" \
            --exclude="beforeword_AI_${version}.html" --exclude=manifest.json --exclude=SHA256SUMS.txt \
            "$release_dir" "$current_dir"
          python3 -B scripts/test_downloads.py
      - name: Build site files locally
        run: python3 -B scripts/build_public.py --output build/site --guide-source build/toolkit --github-url https://github.com/beforeword/beforeword
      - name: Check selected core and generated adapter relationships
        run: |
          beforeword_release="$(python3 -B -c 'from scripts.release_contract import VERSION; print(VERSION)')"
          cmp "downloads/$beforeword_release/beforeword_toolkit_${beforeword_release}.zip" build/site/public_html/model/downloads/beforeword_toolkit.zip
          python3 -B scripts/check_release_sources.py --generated --downloads "downloads/$beforeword_release" --site build/site/public_html
      - name: Check site files and simulated interactions
        run: node scripts/test_public.cjs build/site/public_html
      - name: Check evaluation reader pages and preserved text
        run: python3 -B scripts/test_evaluation.py --site build/site/public_html
      - name: Check public update feeds and static component
        run: python3 -B scripts/test_updates.py --site build/site/public_html
      - name: Check update copying and navigation in a simulated DOM
        run: node scripts/test_updates.cjs build/site/public_html
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beforeword-build
          path: |
            build/toolkit/
            build/site/
          if-no-files-found: error
          retention-days: 14

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned DOM test dependencies
        working-directory: integrations/browser
        run: npm ci --ignore-scripts
      - name: Check browser and service contracts
        working-directory: integrations/browser
        run: npm test
      - name: Build and verify the Chrome package
        working-directory: integrations/browser
        run: python3 -B tools/build-chrome.py --output build
      - name: Upload browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: beforeword-chrome
          path: integrations/browser/build/
          if-no-files-found: error
          retention-days: 14

  mcp-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned reader dependencies
        run: npm ci --ignore-scripts
      - name: Build the self-contained reader UI and exact resource metadata
        run: npm run build
      - name: Check reader protocol, source pins, storage and UI
        run: npm test

  huggingface-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/huggingface
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned connector dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Check dictionary fixtures
        run: python3 -B -m unittest test_dictionary.py
      - name: Check local protocol and exact bilingual instruction retrieval
        run: python3 -B test_protocol.py
