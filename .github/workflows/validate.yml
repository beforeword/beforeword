name: Validate beforeword

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check text request and response formats
        run: python3 scripts/test_payload.py
      - name: Check release selection and exact core packaging boundaries
        run: python3 -B scripts/test_release_contract.py
      - name: Check published navigation and theme wrapper preservation
        run: python3 -B scripts/test_site_wrapper.py
      - name: Check current evaluation records and instruction hashes
        run: python3 -B scripts/test_validation.py
      - name: Check candidate sources and evaluation infrastructure without model calls
        run: |
          python3 -B evaluations/instruction-1.3.6/verify_candidate.py
          python3 -B evaluations/instruction-1.3.6/test_verify_candidate.py
          python3 -B evaluations/instruction-1.3.6/build_candidate_bundle.py --check
          python3 -B evaluations/multi-provider/run.py --self-test
          python3 -B evaluations/multi-provider/score.py --self-test
          python3 -B evaluations/multi-provider/test_runner_contract.py
          python3 -B evaluations/multi-provider/test_checkpoint.py
          python3 -B -O evaluations/multi-provider/test_runner_contract.py
          python3 -B -O evaluations/multi-provider/test_checkpoint.py
      - name: Build standalone guide
        run: python3 scripts/build_guide.py --output build/toolkit
      - name: Check guide behavior in a simulated DOM
        run: node scripts/test_guide.cjs build/toolkit/beforeword_AI.html
      - name: Check RU and EN package contents
        run: python3 scripts/test_packages.py
      - name: Check directory packages and GPT instruction drafts
        run: |
          python3 -B catalog/build.py --check
          python3 -B catalog/check.py
      - name: Check versioned downloads and bilingual guide links
        id: downloads
        run: |
          python3 -B scripts/build_downloads.py --hydrate
          python3 -B scripts/test_downloads.py
          python3 -B scripts/build_downloads.py --check
      - name: Show download metadata drift without changing tracked files
        if: failure() && steps.downloads.outcome == 'failure'
        run: |
          python3 -B - <<'PYCODE'
          import difflib
          import sys
          sys.path.insert(0, "scripts")
          from build_downloads import ROOT, VERSION, build_files
          files = build_files()
          for name in ("manifest.json", "SHA256SUMS.txt"):
              old = (ROOT / "downloads" / VERSION / name).read_text(encoding="utf-8")
              new = files[name].decode("utf-8")
              print("".join(difflib.unified_diff(old.splitlines(True), new.splitlines(True),
                    fromfile="tracked/" + name, tofile="generated/" + name)), end="")
          PYCODE
      - name: Build site files locally
        run: python3 scripts/build_public.py --output build/site --github-url https://github.com/beforeword/beforeword
      - name: Check selected core and generated adapter relationships
        run: |
          beforeword_release="$(python3 -B -c 'from scripts.release_contract import VERSION; print(VERSION)')"
          python3 -B scripts/check_release_sources.py --generated --downloads "downloads/$beforeword_release" --site build/site/public_html
      - name: Check site files and simulated interactions
        run: node scripts/test_public.cjs build/site/public_html
      - name: Check evaluation reader pages and preserved text
        run: python3 -B scripts/test_evaluation.py --site build/site/public_html
      - name: Check public update feeds and static component
        run: python3 -B scripts/test_updates.py --site build/site/public_html
      - name: Check update copying and navigation in a simulated DOM
        run: node scripts/test_updates.cjs build/site/public_html
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beforeword-build
          path: |
            build/toolkit/
            build/site/
          if-no-files-found: error
          retention-days: 14

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned DOM test dependencies
        working-directory: integrations/browser
        run: npm ci --ignore-scripts
      - name: Check browser and service contracts
        working-directory: integrations/browser
        run: npm test
      - name: Build and verify the Chrome package
        working-directory: integrations/browser
        run: python3 -B tools/build-chrome.py --output build
      - name: Upload browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: beforeword-chrome
          path: integrations/browser/build/
          if-no-files-found: error
          retention-days: 14
