name: beforeword evaluation smoke checks

on:
  push:
    paths:
      - "evaluations/multi-provider/**"
      - "evaluations/openai-evals/**"
      - ".github/workflows/beforeword-evals.yml"
  pull_request:
    paths:
      - "evaluations/multi-provider/**"
      - "evaluations/openai-evals/**"
      - ".github/workflows/beforeword-evals.yml"

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runner
        run: python -m py_compile evaluations/multi-provider/run.py evaluations/multi-provider/score.py
      - name: Self-test (no external calls)
        run: python evaluations/multi-provider/run.py --self-test
      - name: Score synthetic cases (no model calls)
        run: python evaluations/multi-provider/score.py --self-test
      - name: Dry run (no external calls)
        run: python evaluations/multi-provider/run.py
      - name: JSONL syntax and case uniqueness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sources = sorted(Path('evaluations/openai-evals/registry/data').rglob('*.jsonl'))
          assert sources, 'No eval data found'
          for path in sources:
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              assert rows, path
              print(path, 'parsed rows:', len(rows))
          PY
